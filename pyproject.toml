[project]
name = "pde_data_gen"
version = "0.1.0"

description = "PDE data generation tools"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "netCDF4>=1.6.0",
    "python-dotenv>=1.0.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "pyvista>=0.45.2",
    "pydantic>=2.11.6",
    "xarray>=2024.7.0",
    "ipykernel>=6.29.5",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "plotly>=6.3.1",
    "dask>=2024.8.0",
    "pytest>=8.4.2",
    "scikit-image>=0.24.0",
    "nbformat>=5.10.4",
]

[tool.setuptools]
packages = ["src"]
