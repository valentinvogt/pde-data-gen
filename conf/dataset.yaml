# Dataset generation configuration
defaults:
  - config
  - _self_

# Sample dataset configuration for multiple models and parameter spaces
dataset_id: int
dataset_type: multi_ic
center_definition: from_df
df_path: data/int.csv
workdir_env_var: SCRATCHDIR # An environment variable of this name should exist

sim_params:
  Nx: 128
  dx: 0.5
  Nt: 60_000
  dt: 0.0025
  n_snapshots: 100

# Multiple initial conditions to test different patterns
initial_conditions:
  - type: normal
    sigma_u: 0.1
    sigma_v: 0.1
  # - type: point_sources
  #   density: 0.05
  # - type: hex_pattern
  #   amplitude: 0.1
  #   wavelength: 10

