# Gray-Scott model for single point
defaults:
  - config
  - _self_

model: gray_scott
dataset_id: gs_rough
dataset_type: multi_ic
center_definition: from_df
df_path: "data/gs_rough.csv"
workdir_env_var: SCRATCHDIR # An environment variable of this name should exist

# grid_mode: absolute
# grid_params:
#   A: [0.037]
#   B: [0.06]
#   Du: [0.2]
#   Dv: [0.1]

sim_params:
  Nx: 128
  dx: 1.0
  Nt: 60_000
  dt: 0.01
  n_snapshots: 100

initial_conditions:
  - type: point_sources
    density: 0.05
  - type: point_sources
    density: 0.15
  
    